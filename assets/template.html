<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trip</title>
<style>
:root{--bg:#f5f8fc;--card:#fff;--ink:#1f2d3d;--sub:#6b7c93;--accent:#2f6df6;--line:#e6edf6;--warn:#e8a33d;--crit:#e5484d;--ok:#2fae6b;}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,"PingFang SC","Microsoft Yahei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.wrap{max-width:720px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0}.meta{color:var(--sub);font-size:14px;margin-bottom:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:12px 0;box-shadow:0 1px 4px rgba(31,45,61,.04)}
.card h2{font-size:16px;margin:0 0 10px;display:flex;align-items:center;gap:6px}
.poi{padding:8px 0;border-bottom:1px dashed var(--line)}.poi:last-child{border:none}
.time{display:inline-block;background:var(--accent);color:#fff;border-radius:6px;padding:1px 7px;font-size:12px;margin-right:6px}
.tag{display:inline-block;background:#eef3fe;color:var(--accent);border-radius:5px;padding:0 6px;font-size:12px;margin:2px 4px 2px 0}
.sub{color:var(--sub);font-size:13px}a{color:var(--accent);text-decoration:none}
.pill{font-size:12px;border-radius:20px;padding:1px 9px;border:1px solid var(--line)}
.s-used{color:var(--ok);border-color:#bfe8d2}.s-degraded{color:var(--warn);border-color:#f2dcb0}.s-unavailable,.s-not_applicable{color:var(--sub)}
.sev-critical{color:var(--crit)}.sev-warning{color:var(--warn)}.sev-notice{color:var(--sub)}
.planb{background:#fff8ec;border-left:3px solid var(--warn);padding:6px 10px;border-radius:6px;margin-top:6px;font-size:13px}
.foot{color:var(--sub);font-size:12px;text-align:center;margin:20px 0}
.linkline{font-size:13px;margin-top:4px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script id="trip" type="application/json">__TRIP_JSON__</script>
<script>
const T = JSON.parse(document.getElementById('trip').textContent);
const el = (h)=>{const d=document.createElement('div');d.innerHTML=h;return d.firstElementChild;};
const esc = (s)=>String(s==null?'':s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
function priceStr(p){if(!p)return'';const c=p.currency||'USD';let lo=p.total_min??p.min,hi=p.total_max??p.max;if(lo==null&&hi==null)return'';let b=(lo!=null&&hi!=null&&lo!==hi)?`${c} ${lo}–${hi}`:`${c} ${lo??hi}`;if(p.unit)b+='/'+p.unit;return b;}
function linksStr(ls){return (ls||[]).filter(l=>l.url).map(l=>`<a href="${esc(l.url)}" target="_blank" rel="noopener">${esc(l.provider)}</a>`).join(' · ');}
const app = document.getElementById('app');
document.title = T.trip_name||'Trip';
let m=[`<h1>${esc(T.trip_name||'行程')}</h1>`];
let meta=[`📍 ${esc(T.destination||'')}`]; if(T.country)meta.push(esc(T.country));
meta.push(`🗓 ${esc(T.date_range||'')}`,`👥 ${esc(T.party_size||'')}`); if(T.origin)meta.push(`出发 ${esc(T.origin)}`);
m.push(`<div class="meta">${meta.join(' ｜ ')}</div>`);
if(T.summary)m.push(`<div class="card sub">${esc(T.summary)}</div>`);
app.appendChild(el(m.join('')));

// flights
if((T.flights||[]).length){let h=`<div class="card"><h2>✈️ 航班（查询链接）</h2>`;
T.flights.forEach(f=>{const leg={outbound:'去程',return:'返程',internal:'内陆'}[f.leg]||f.leg;
h+=`<div class="poi"><b>${leg}</b> ${esc(f.origin)} → ${esc(f.dest)} <span class="sub">${esc(f.date||'')} · ${esc(f.status||'')}</span>`;
if(f.links)h+=`<div class="linkline">${linksStr(f.links)}</div>`;if(f.note)h+=`<div class="sub">${esc(f.note)}</div>`;h+=`</div>`;});
h+=`</div>`;app.appendChild(el(h));}

// hotel
if(T.hotel){const ho=T.hotel;let h=`<div class="card"><h2>🏨 酒店</h2><div class="poi"><b>${esc(ho.name||'')}</b> <span class="sub">${esc(ho.address||'')}</span>`;
if(ho.why)h+=`<div class="sub">${esc(ho.why)}</div>`;const ps=priceStr(ho.price);if(ps)h+=`<div class="sub">参考价 ${ps}</div>`;
if(ho.booking_links)h+=`<div class="linkline">${linksStr(ho.booking_links)}</div>`;h+=`</div></div>`;app.appendChild(el(h));}

// days
(T.days||[]).forEach(d=>{let h=`<div class="card"><h2>Day ${d.day} · ${esc(d.date||'')} · ${esc(d.region||'')}</h2>`;
if(d.theme)h+=`<div class="sub">${esc(d.theme)}</div>`;if(d.weather)h+=`<div class="sub">🌤 ${esc(d.weather)}</div>`;
(d.pois||[]).forEach(p=>{h+=`<div class="poi"><span class="time">${esc(p.time||'')}</span><b>${esc(p.name||'')}</b> <span class="sub">约${p.duration_min||0}分钟</span>`;
let tg=[];const ps=priceStr(p.price);if(ps)tg.push(ps);if(p.requires_booking)tg.push('需预约');if(p.weather_sensitive)tg.push('怕雨');
if(tg.length)h+=' '+tg.map(t=>`<span class="tag">${esc(t)}</span>`).join('');
if(p.map_links)h+=`<div class="linkline">${linksStr(p.map_links)}</div>`;h+=`</div>`;});
let pb=d.plan_b;if(pb){(Array.isArray(pb)?pb:[pb]).forEach(b=>{h+=`<div class="planb">☔ <b>Plan B</b>：${esc(b.trigger)} → ${esc(b.alternative)}（${esc(b.impact)}）</div>`;});}
h+=`</div>`;app.appendChild(el(h));});

// prebook
if((T.prebook||[]).length){let h=`<div class="card"><h2>📋 预约/购票</h2>`;
T.prebook.forEach(p=>{const mk={must:'🔴',recommended:'🟡',optional:'⚪'}[p.priority]||'';
h+=`<div class="poi">${mk} <b>${esc(p.item)}</b> <span class="sub">截止 ${esc(p.deadline||'')} · ${esc(p.status||'')}</span> <a href="${esc(p.url)}" target="_blank">链接</a></div>`;});
h+=`</div>`;app.appendChild(el(h));}

// budget
const bs=priceStr(T.budget_summary);if(bs)app.appendChild(el(`<div class="card"><h2>💰 预算</h2><div>合计约 ${bs}</div></div>`));

// safety
if((T.safety_notes||[]).length){let h=`<div class="card"><h2>⚠️ 安全提醒</h2>`;
T.safety_notes.forEach(s=>{h+=`<div class="poi sev-${esc(s.severity)}">${esc(s.risk)} → ${esc(s.action)}</div>`;});h+=`</div>`;app.appendChild(el(h));}

// sources
if((T.source_coverage||[]).length){let h=`<div class="card"><h2>🔎 信息源</h2>`;
T.source_coverage.forEach(c=>{h+=`<div class="poi"><span class="pill s-${esc(c.status)}">${esc(c.platform)} · ${esc(c.status)}</span> <span class="sub">${esc(c.purpose)}（${esc(c.checked_at||'')}）</span></div>`;});h+=`</div>`;app.appendChild(el(h));}

// rechecks
if((T.rechecks||[]).length){let h=`<div class="card"><h2>🔁 行前复核</h2>`;
T.rechecks.forEach(r=>{h+=`<div class="poi sub">${esc(r.item)}（${esc(r.category)}）· ${esc(r.status)} · 下次 ${esc(r.recheck_at||'')}</div>`;});h+=`</div>`;app.appendChild(el(h));}

app.appendChild(el(`<div class="foot">Generated by global-travel-planner · 价格与开放信息请以链接内实时页面为准</div>`));
</script>
</body>
</html>
