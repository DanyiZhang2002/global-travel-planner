<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>行旅日记</title><style>
:root{--p:#379bd9;--bg:#edf6fc;--text:#263b4a;--line:#dbe8f0}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,input,select,textarea{font:inherit}.app{max-width:760px;margin:auto;padding:18px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.title{font-size:25px;font-weight:800}.sub,.muted{color:#718495;font-size:14px}.card{background:#fff;border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 3px 14px #4784a018}.btn{border:0;border-radius:12px;padding:11px 15px;background:#fff;color:var(--p);font-weight:650;cursor:pointer}.primary{background:var(--p);color:#fff}.danger{color:#d95d5d}.icon{padding:7px;background:#f1f7fb;border-radius:9px}.trip{display:grid;grid-template-columns:82px 1fr;gap:13px;cursor:pointer}.cover{width:82px;height:82px;border-radius:14px;background:#dff1fb;object-fit:cover;display:grid;place-items:center;font-size:28px}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.spread{justify-content:space-between}.bar{height:7px;background:#e7f0f5;border-radius:7px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:var(--p)}.empty{text-align:center;padding:75px 20px}.empty svg{width:100px;color:var(--p)}.fab{position:fixed;right:22px;bottom:23px;width:58px;height:58px;border:0;border-radius:50%;background:var(--p);color:#fff;font-size:30px;box-shadow:0 7px 20px #379bd966}.tabs{display:flex;background:#e6f1f7;border-radius:12px;padding:3px;gap:3px}.tabs button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;color:#638095}.tabs .on{background:#fff;color:var(--p);font-weight:bold}.month{display:flex;align-items:center;justify-content:space-between;margin:17px 0}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.week{text-align:center;color:#7e909d;font-size:13px}.day{border:0;background:transparent;min-height:55px;border-radius:12px;padding:4px;color:var(--text);position:relative}.day.active{background:#e5f3fb}.day.out{opacity:.34}.day.today{outline:2px solid var(--p)}.dots{display:flex;justify-content:center;gap:3px;margin-top:5px}.dot{width:6px;height:6px;border-radius:50%}.timeline{border-left:2px solid #dcebf4;margin:10px 0 0 28px;padding-left:18px}.item{position:relative}.item:before{content:'';position:absolute;width:12px;height:12px;border:3px solid #fff;background:var(--c);border-radius:50%;left:-26px;top:22px}.time{font-size:14px;color:#728494}.badge{font-size:13px;padding:3px 8px;border-radius:99px;color:#fff;background:var(--c)}.done{text-decoration:line-through;opacity:.55}.sheet{position:fixed;inset:0;background:#17324466;display:flex;align-items:flex-end;z-index:4}.form{max-height:92vh;overflow:auto;background:#fff;width:100%;max-width:720px;margin:auto;border-radius:22px 22px 0 0;padding:20px}.field{margin:13px 0}.field label{display:block;font-weight:650;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:11px;padding:11px;background:#fff}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#263b4a;color:white;padding:11px 16px;border-radius:11px;z-index:8}.photo{width:62px;height:62px;border-radius:10px;object-fit:cover;margin:4px}@media(min-width:700px){.sheet{align-items:center;padding:20px}.form{border-radius:20px}.day{min-height:70px}}
</style></head><body><div id="app"></div><script>
const $=s=>document.querySelector(s),A='api/';let state={view:'list',trip:null,date:null,month:new Date(),items:[],edit:null};const types={transport:['交通','#438fd5'],attraction:['景点','#57ad7b'],dining:['餐饮','#e89b54'],hotel:['酒店','#997fd0'],activity:['自由活动','#8c9aa8'],other:['其他','#6babb8']};
async function api(p,o={}){let r=await fetch(A+p,{headers:o.body instanceof FormData?{}:{'content-type':'application/json'},...o,body:o.body&&!(o.body instanceof FormData)?JSON.stringify(o.body):o.body});if(r.status===204)return null;let d=await r.json();if(!r.ok)throw Error(d.detail||'操作失败');return d}function toast(x){let e=document.createElement('div');e.className='toast';e.textContent=x;document.body.append(e);setTimeout(()=>e.remove(),2600)}function go(v,t=null,d=null){state.view=v;state.trip=t;state.date=d;render()}function icon(){return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M3 12h18M12 3v18M5 19l14-14"/></svg>'}function fmt(d){if(!d)return '未设置日期';let x=new Date(d+'T00:00');return `${x.getMonth()+1}月${x.getDate()}日`}function dow(d){return ['日','一','二','三','四','五','六'][new Date(d+'T00:00').getDay()]}function safeUrl(u){return (u||'').replace(/^\//,'')}
async function render(){try{if(state.view==='list')return list();if(state.view==='trip')return trip();if(state.view==='day')return day();if(state.view==='overview')return overview();if(state.view==='tripform')return tripForm();if(state.view==='itemform')return itemForm()}catch(e){$('#app').innerHTML=`<main class="app"><div class="empty"><h2>加载失败</h2><p>${e.message}</p><button class="btn primary" onclick="render()">重试</button></div></main>`}}
async function list(){let {trips}=await api('trips');$('#app').innerHTML=`<main class="app"><div class="top"><div><div class="title">行旅日记</div><div class="sub">把每段旅程，安排得刚刚好</div></div><button class="btn primary" onclick="go('tripform')">＋ 新建</button></div>${trips.length?trips.map(t=>{let p=t.item_count?Math.round(t.done_count/t.item_count*100):0;return `<div class="card trip" onclick="go('trip',${t.id})"><div class="cover">${t.cover_image?`<img class="cover" src="${safeUrl(t.cover_image)}">`:'⌁'}</div><div><div class="row spread"><b>${t.name}</b><span class="sub">${p}%</span></div><div class="sub">${t.destination||'未设目的地'} · ${fmt(t.start_date)}—${fmt(t.end_date)}</div><div class="bar"><i style="width:${p}%"></i></div><div class="sub">${t.done_count}/${t.item_count} 项已完成</div></div></div>`}).join(''):`<div class="empty"><svg>${icon()}</svg><h2>还没有旅行计划</h2><p class="muted">从第一段旅程开始记录吧</p><button class="btn primary" onclick="go('tripform')">创建旅行</button></div>`}</main>`}
async function trip(){let d=await api('trips/'+state.trip),t=d.trip;state.items=(await api(`trips/${state.trip}/items`)).items;let y=state.month.getFullYear(),m=state.month.getMonth(),first=new Date(y,m,1),start=new Date(y,m,1-first.getDay());let by={};state.items.forEach(i=>(by[i.date]??=[]).push(i));let cells=[...Array(42)].map((_,n)=>{let x=new Date(start);x.setDate(start.getDate()+n);let iso=x.toISOString().slice(0,10),its=by[iso]||[],cls=x.getMonth()!=m?'out ':'';if(its.length)cls+='active ';return `<button class="day ${cls}" onclick="go('day',${state.trip},'${iso}')"><b>${x.getDate()}</b><div class="dots">${[...new Set(its.map(i=>i.type))].slice(0,3).map(k=>`<i class="dot" style="background:${types[k]?.[1]||'#888'}"></i>`).join('')}</div></button>`}).join('');$('#app').innerHTML=`<main class="app"><div class="top"><button class="btn" onclick="go('list')">‹ 返回</button><button class="btn" onclick="go('overview',${state.trip})">概览</button></div><div class="card"><div class="title">${t.name}</div><div class="sub">${t.destination||'未设目的地'} · ${fmt(t.start_date)}—${fmt(t.end_date)}</div></div><div class="month"><button class="btn" onclick="state.month.setMonth(state.month.getMonth()-1);render()">‹</button><b>${y}年${m+1}月</b><button class="btn" onclick="state.month.setMonth(state.month.getMonth()+1);render()">›</button></div><div class="cal">${['日','一','二','三','四','五','六'].map(x=>`<div class="week">${x}</div>`).join('')}${cells}</div><button class="fab" onclick="go('itemform',${state.trip},'${new Date().toISOString().slice(0,10)}')">＋</button></main>`}
async function day(){let d=await api('trips/'+state.trip),items=(await api(`trips/${state.trip}/items?date_filter=${state.date}`)).items;$('#app').innerHTML=`<main class="app"><div class="top"><button class="btn" onclick="go('trip',${state.trip})">‹ 日历</button><button class="btn" onclick="copyDay()">复制当天</button></div><div class="title">${fmt(state.date)} · 周${dow(state.date)}</div>${items.length?`<div class="timeline">${items.map(i=>{let z=types[i.type]||types.other;return `<div class="item card" style="--c:${z[1]}"><div class="time">${i.start_time||'待定'}${i.end_time?' — '+i.end_time:''}</div><div class="row spread"><b class="${i.completed?'done':''}">${i.title}</b><span class="badge">${z[0]}</span></div>${i.location?`<div class="sub">⌖ ${i.location}</div>`:''}${i.cost?`<div class="sub">¥${i.cost}</div>`:''}${i.precautions?`<div class="sub">注意：${i.precautions}</div>`:''}<div class="row"><button class="btn icon" onclick="toggle(${i.id},${!i.completed})">${i.completed?'↺':'✓'}</button><button class="btn icon" onclick="editItem(${i.id})">编辑</button><button class="btn danger" onclick="delItem(${i.id})">删除</button></div></div>`}).join('')}</div>`:`<div class="empty"><h2>今天还没有安排</h2><p class="muted">添加一条行程，让旅程更清晰。</p></div>`}<button class="fab" onclick="go('itemform',${state.trip},'${state.date}')">＋</button></main>`}
async function toggle(id,v){await api('items/'+id,{method:'PUT',body:{completed:v}});render()}async function delItem(id){if(confirm('确定删除这条行程吗？')){await api('items/'+id,{method:'DELETE'});toast('已删除');render()}}async function copyDay(){let to=prompt('复制到哪一天？','');if(to){let r=await api(`trips/${state.trip}/copy-day`,{method:'POST',body:{fromDate:state.date,toDate:to}});toast(`已复制 ${r.copied} 条行程`);go('day',state.trip,to)}}
async function overview(){let d=await api('trips/'+state.trip),items=(await api(`trips/${state.trip}/items`)).items,t=d.trip,sp=items.reduce((s,i)=>s+(+i.cost||0),0);$('#app').innerHTML=`<main class="app"><div class="top"><button class="btn" onclick="go('trip',${state.trip})">‹ 返回</button><button class="btn" onclick="go('tripform',${state.trip})">编辑旅行</button></div><div class="card"><div class="title">${t.name}</div><p>${t.destination||'未设目的地'} · ${fmt(t.start_date)}—${fmt(t.end_date)}</p><p class="muted">${t.notes||'暂无旅行备注'}</p></div><div class="grid2"><div class="card"><b>总预算</b><div class="title">¥${t.total_budget||'—'}</div></div><div class="card"><b>已记录花费</b><div class="title">¥${sp.toFixed(0)}</div></div></div><h3>每日摘要</h3>${d.days.map(x=>`<div class="card row spread" onclick="go('day',${state.trip},'${x.date}')"><b>${fmt(x.date)} · 周${dow(x.date)}</b><span class="sub">${x.itemCount} 项 · ¥${x.costSum}</span></div>`).join('')||'<p class="muted">还没有行程</p>'}</main>`}
async function tripForm(){let old=state.trip? (await api('trips/'+state.trip)).trip:{};$('#app').innerHTML=`<main class="app"><div class="top"><button class="btn" onclick="go('${state.trip?'trip':'list'}',${state.trip||''})">‹ 返回</button><b>${state.trip?'编辑旅行':'新建旅行'}</b></div><form class="card" id="tf"><div class="field"><label>旅行名称 *</label><input name="name" required value="${old.name||''}"></div><div class="field"><label>目的地</label><input name="destination" value="${old.destination||''}"></div><div class="grid2"><div class="field"><label>开始日期 *</label><input type="date" name="startDate" required value="${old.start_date||''}"></div><div class="field"><label>结束日期 *</label><input type="date" name="endDate" required value="${old.end_date||''}"></div></div><div class="field"><label>总预算</label><input type="number" name="totalBudget" value="${old.total_budget||''}"></div><div class="field"><label>备注</label><textarea name="notes">${old.notes||''}</textarea></div><button class="btn primary">保存旅行</button></form></main>`;$('#tf').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.totalBudget=o.totalBudget?+o.totalBudget:null;await api(state.trip?'trips/'+state.trip:'trips',{method:state.trip?'PUT':'POST',body:o});toast('已保存');go('list')}}
async function editItem(id){let x=(await api(`trips/${state.trip}/items?date_filter=${state.date}`)).items.find(i=>i.id===id);state.edit=x;go('itemform',state.trip,x.date)}
function extraFields(t,e={}){let f={transport:[['vehicle','交通工具'],['tripNo','航班号 / 车次'],['from','出发地'],['to','目的地']],attraction:[['openHours','开放时间'],['ticket','门票信息'],['reservation','预约要求'],['duration','游玩时长']],hotel:[['checkIn','入住时间'],['checkOut','退房时间'],['bookingNo','预订编号']],dining:[['reservation','预约信息'],['perPerson','人均预算'],['dishes','推荐菜']]}[t]||[];return f.map(([k,l])=>`<div class="field"><label>${l}</label><input data-extra="${k}" value="${e[k]||''}"></div>`).join('')}
async function itemForm(){let old=state.edit||{},imgs=[...(old.images||[])];$('#app').innerHTML=`<main class="app"><div class="top"><button class="btn" onclick="state.edit=null;go('day',${state.trip},'${state.date}')">‹ 返回</button><b>${old.id?'编辑行程':'新增行程'}</b></div><form class="card" id="if"><div class="field"><label>行程类型</label><select name="type" id="ty">${Object.entries(types).map(([k,v])=>`<option value="${k}" ${old.type===k?'selected':''}>${v[0]}</option>`).join('')}</select></div><div id="extras">${extraFields(old.type||'transport',old.extra||{})}</div><div class="field"><label>行程标题 *</label><input name="title" required value="${old.title||''}"></div><div class="field"><label>日期 *</label><input type="date" name="date" required value="${old.date||state.date}"></div><div class="grid2"><div class="field"><label>开始时间（不填为待定）</label><input type="time" name="startTime" value="${old.start_time||''}"></div><div class="field"><label>结束时间</label><input type="time" name="endTime" value="${old.end_time||''}"></div></div><div class="field"><label>地点</label><input name="location" value="${old.location||''}"></div><div class="field"><label>详细地址</label><input name="address" value="${old.address||''}"></div><div class="field"><label>交通方式</label><input name="transport" value="${old.transport||''}"></div><div class="field"><label>预估花费</label><input type="number" name="cost" value="${old.cost||''}"></div><div class="field"><label>注意事项</label><textarea name="precautions">${old.precautions||''}</textarea></div><div class="field"><label>备注</label><textarea name="notes">${old.notes||''}</textarea></div><div class="field"><label>图片</label><input id="imgs" type="file" accept="image/*" multiple><div id="previews">${imgs.map(x=>`<img class="photo" src="${safeUrl(x)}">`).join('')}</div></div><button class="btn primary">保存行程</button></form></main>`;$('#ty').onchange=e=>{$('#extras').innerHTML=extraFields(e.target.value,{})};$('#imgs').onchange=async e=>{for(let f of e.target.files){let fd=new FormData;fd.append('file',f);let r=await api('upload',{method:'POST',body:fd});imgs.push(r.url);$('#previews').innerHTML+=`<img class="photo" src="${safeUrl(r.url)}">`}toast('图片已上传')};$('#if').onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));o.cost=o.cost?+o.cost:null;o.extra=Object.fromEntries([...document.querySelectorAll('[data-extra]')].map(x=>[x.dataset.extra,x.value]).filter(x=>x[1]));o.images=imgs;await api(old.id?'items/'+old.id:`trips/${state.trip}/items`,{method:old.id?'PUT':'POST',body:o});toast('已保存');state.edit=null;go('day',state.trip,o.date)}}
render();
</script></body></html>
